<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RawSignal Analysis</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="container">
        <h2>RawSignal Analysis</h2>
        <div id="loading" style="display:none;">Analyzing...</div>
        <div id="results" style="display:none;">
            <div class="score-box">
                <span id="score">--</span>
                <span>% loaded language</span>
            </div>
            <div id="summary">
                <h3>Summary</h3>
                <p id="summary-text"></p>
            </div>
            <div id="flags">
                <h3>Flags Found</h3>
                <ul id="flag-list"></ul>
            </div>
        </div>
        <div id="error" style="display:none; color:red;"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
